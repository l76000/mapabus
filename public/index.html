<!DOCTYPE html>
<html lang="sr">
<head>
    <script src="/auth-check.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nezvanični prikaz vozila javnog prevoza Beograda u realnom vremenu.">
    <meta name="author" content="Nezavisni projekat">
    <meta name="robots" content="noindex, nofollow">
    <title>mapabus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #E6C975 0%, #D4B35A 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Kontejner za logoe */
        .floating-logos-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-logo {
            position: absolute;
            width: 80px;
            height: auto;
            /* Povećana vidljivost (manja transparentnost) */
            opacity: 0.3; 
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(40px, 40px) rotate(10deg); }
            66% { transform: translate(-40px, 60px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Arial Black', Arial, sans-serif;
            color: white;
            font-size: 2.5em;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            display: inline-block;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            padding: 20px 50px;
            background: white;
            color: #667eea;
            text-decoration: none;
            font-size: 1.3em;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            min-width: 250px;
            position: relative;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            background: #f8f9ff;
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-admin {
            background: #2c3e50;
            color: white;
            display: none;
        }

        .btn-admin:hover {
            background: #34495e;
        }

        .btn-admin.has-pending {
            background: #e74c3c;
            animation: pulse 2s infinite;
        }

        .btn-admin.has-pending:hover {
            background: #c0392b;
        }

        .notification-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .btn { padding: 15px 40px; font-size: 1.1em; min-width: 200px; }
        }
    </style>
</head>
<body>
    <div class="floating-logos-container" id="logoContainer"></div>

    <div class="container">
        <h1>MapaBus</h1>
        <div class="button-container">
            <a href="https://busmapa.vercel.app/api/sve" class="btn">Sva Vozila</a>
            <a href="https://busmapa.vercel.app/api/linije" class="btn">Izbor Linije</a>
            <a href="https://busmapa.vercel.app/baza.html" class="btn">Baza Vozila</a>
            <a href="polasci.html" class="btn">Baza Linija</a>
            <a href="admin.html" class="btn btn-admin" id="adminBtn">
                🔐 Admin Panel
                <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
            </a>
        </div>
    </div>

    <script>
        // Lista URL-ova logoa
        const logos = [
            "https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Mercedes-Logo.svg/1200px-Mercedes-Logo.svg.png",
            "https://tiryataklari.com.tr/wp-content/uploads/2023/09/bmc-logo.png",
            "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/MAN_Truck_%26_Bus_-_Logo.svg/1200px-MAN_Truck_%26_Bus_-_Logo.svg.png",
            "https://vectorseek.com/wp-content/uploads/2023/11/Scania-new-Logo-Vector.svg-.png",
            "https://akia-avesto.tj/wp-content/uploads/2021/12/cropped-logo-dark.png",
            "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Otokar_logo.svg/1280px-Otokar_logo.svg.png",
            "https://i.namu.wiki/i/34eHA4PfzvhmGjnypy2JHwoxwwVW4JBkZ3Wvx4ya_WRn79e1Lj_GQ1xoQUfvVaVbMhU4_vTGGKBLiFWGDkNCsw.webp",
            "https://upload.wikimedia.org/wikipedia/commons/0/03/Yutong_Logo.png",
            "https://www.carlogos.org/car-logos/higer-logo.png",
            "https://upload.wikimedia.org/wikipedia/commons/8/89/Logo_ikarbus.png",
            "https://logos-world.net/wp-content/uploads/2021/09/Isuzu-Logo.png",
            "https://logos-world.net/wp-content/uploads/2021/09/Iveco-Logo.png",
            "https://autotheme.info/wp-content/uploads/2019/12/maz.png",
            "https://images.seeklogo.com/logo-png/17/2/temsa-logo-png_seeklogo-179572.png",
            "https://upload.wikimedia.org/wikipedia/commons/4/4f/Sor-logo.png",
            "https://www.guleryuz.com/assets/img/guleryuz-logo.png"
        ];

        function generateFloatingLogos() {
            const container = document.getElementById('logoContainer');
            const logoCount = 40; // Ukupan broj logoa na ekranu

            for (let i = 0; i < logoCount; i++) {
                const img = document.createElement('img');
                
                // Nasumičan izbor logoa iz liste
                const randomLogoUrl = logos[Math.floor(Math.random() * logos.length)];
                
                img.src = randomLogoUrl;
                img.classList.add('floating-logo');
                
                // Nasumična pozicija
                img.style.left = Math.random() * 100 + '%';
                img.style.top = Math.random() * 100 + '%';
                
                // Nasumična veličina (između 60px i 100px) da bude raznovrsnije
                const size = 60 + Math.random() * 40;
                img.style.width = size + 'px';
                
                // Nasumična animacija
                img.style.animationDuration = (20 + Math.random() * 20) + 's'; // 20-40s trajanje
                img.style.animationDelay = (Math.random() * -40) + 's'; // Počinje odmah u različitim fazama

                container.appendChild(img);
            }
        }

        // Pokreni generisanje logoa odmah
        generateFloatingLogos();

        // --- POSTOJEĆA LOGIKA ZA ADMIN PANEL ---

        async function checkAdminStatus() {
            const token = localStorage.getItem('authToken');
            if (!token) return;

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'verify', token: token })
                });

                const data = await response.json();

                if (data.success && data.isAdmin) {
                    document.getElementById('adminBtn').style.display = 'inline-block';
                    checkPendingUsers(token);
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
            }
        }

        async function checkPendingUsers(token) {
            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'listUsers', token: token })
                });
                
                const data = await response.json();

                if (data.success && data.users) {
                    const pendingCount = data.users.filter(u => u.status === 'pending').length;
                    const adminBtn = document.getElementById('adminBtn');
                    const badge = document.getElementById('notificationBadge');
                    
                    if (pendingCount > 0) {
                        adminBtn.classList.add('has-pending');
                        badge.textContent = pendingCount;
                        badge.style.display = 'flex';
                    } else {
                        adminBtn.classList.remove('has-pending');
                        badge.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error checking pending users:', error);
            }
        }

        let isAdmin = false;

        async function initializeAdminFeatures() {
            const token = localStorage.getItem('authToken');
            if (!token) return;

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'verify', token: token })
                });

                const data = await response.json();

                if (data.success && data.isAdmin) {
                    isAdmin = true;
                    document.getElementById('adminBtn').style.display = 'inline-block';
                    await checkPendingUsers(token);
                    
                    setInterval(async () => {
                        const currentToken = localStorage.getItem('authToken');
                        if (currentToken && isAdmin) {
                            await checkPendingUsers(currentToken);
                        }
                    }, 30000);
                }
            } catch (error) {
                console.error('Error initializing admin features:', error);
            }
        }

        window.addEventListener('load', initializeAdminFeatures);
    </script>
</body>
</html>
